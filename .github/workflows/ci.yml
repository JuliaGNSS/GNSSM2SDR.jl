name: Test
on:
  push:
    branches:
      - 'master'
    tags: ['*']
  pull_request:
jobs:
  test:
    name: ${{ matrix.project }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
        # The receiver's side and the trimmable loop package, each with its
        # own environment and test suite. Neither needs a board: the loop
        # tests run against the gateware emulator.
        project:
          - '.'
          - 'M2SDRLoop'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ matrix.project }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,M2SDRLoop/src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          plugins: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
